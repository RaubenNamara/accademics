---
# cPanel Git Version Control: "Deploy HEAD Commit" runs these tasks.
# deploy/deploy.sh copies dist/ and backend/ into the live site and keeps the server's own
# files (.htaccess, php.ini, backend/config/*.local.php, uploads). cPanel has already pulled,
# so the script does not pull again. Database migrations are still run by hand after a backup.
deployment:
  tasks:
    - /bin/bash "$HOME/repositories/accademics/deploy/deploy.sh" --no-pull
